name: Debug Server Log

# 手动触发：SSH 进服务器 tail Laravel 错误日志，定位线上 500/异常根因。
# dispatch-only，不在 push 上自动跑。完事可保留作日后排障工具。

on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'tail 行数'
        required: false
        default: '200'
      grep:
        description: '过滤关键字（留空=全部）'
        required: false
        default: ''

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd /www/wwwroot/laradmin
            echo "=== logs dir ==="
            ls -lt storage/logs/ 2>/dev/null | head -10
            # 兼容 laravel.log（单文件）与 laravel-*.log（按日期）
            LOG=$(ls -t storage/logs/laravel.log storage/logs/laravel-*.log 2>/dev/null | head -1)
            echo "=== latest log: $LOG ==="
            if [ -z "$LOG" ]; then echo "no laravel log found"; exit 0; fi
            if [ -n "${{ inputs.grep }}" ]; then
              # -A 带后续行，抓异常栈帧
              grep -EiA 25 "${{ inputs.grep }}" "$LOG" | tail -n ${{ inputs.lines }}
            else
              tail -n ${{ inputs.lines }} "$LOG"
            fi
