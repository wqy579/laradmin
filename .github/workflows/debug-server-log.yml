name: Debug Server Log

# 手动触发：SSH 进服务器排障。
#   - command 留空 = 默认 tail Laravel 错误日志（配 grep/lines）
#   - command 传任意 shell = 在 /www/wwwroot/laradmin 下执行（如 SHOW COLUMNS 之类）
# dispatch-only，不在 push 自动跑。保留作日后排障工具。

on:
  workflow_dispatch:
    inputs:
      command:
        description: '要执行的命令（留空=tail 日志）'
        required: false
        default: ''
      lines:
        description: 'tail 行数'
        required: false
        default: '200'
      grep:
        description: '日志过滤关键字（留空=全部）'
        required: false
        default: ''

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd /www/wwwroot/laradmin

            # 传了 command 就原样执行（排查用，如表结构）
            CMD="${{ inputs.command }}"
            if [ -n "$CMD" ]; then
              echo "=== run: $CMD ==="
              # 写临时脚本执行，规避引号嵌套
              printf '%s\n' "$CMD" > /tmp/dbg.sh
              bash /tmp/dbg.sh
              exit 0
            fi

            echo "=== logs dir ==="
            ls -lt storage/logs/ 2>/dev/null | head -10
            # 兼容 laravel.log（单文件）与 laravel-*.log（按日期）
            LOG=$(ls -t storage/logs/laravel.log storage/logs/laravel-*.log 2>/dev/null | head -1)
            echo "=== latest log: $LOG ==="
            if [ -z "$LOG" ]; then echo "no laravel log found"; exit 0; fi
            if [ -n "${{ inputs.grep }}" ]; then
              # -A 带后续行，抓异常栈帧
              grep -EiA 25 "${{ inputs.grep }}" "$LOG" | tail -n ${{ inputs.lines }}
            else
              tail -n ${{ inputs.lines }} "$LOG"
            fi
