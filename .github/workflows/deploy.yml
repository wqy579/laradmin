name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ========== 云端构建前端（不占服务器内存） ==========
      - name: Build frontend
        working-directory: frontend
        run: |
          mkdir -p ../public/admin
          npm ci --no-audit --no-fund
          npm run build

      # ========== 打包源码 + 产物（放 workspace 内，scp 容器可见） ==========
      - name: Package source & dist
        run: |
          rm -rf deploy_pkg
          mkdir -p deploy_pkg/source deploy_pkg/dist
          rsync -a --exclude vendor --exclude node_modules --exclude .git \
            --exclude storage --exclude .env --exclude public/admin \
            --exclude deploy_pkg \
            ./ deploy_pkg/source/
          cp -r frontend/dist/* deploy_pkg/dist/

      # ========== 清理服务器上的 staging 目录 ==========
      # scp 只增不删：上个部署遗留的文件（如已从仓库删除的 config/modules.php、
      # Return.php）会一直留在 /tmp/laradmin-deploy/source，被 rsync 原样还原进
      # 线上目录，导致应用 boot 崩溃（2026-09-13 生产 500 事故根因）。必须先清空。
      - name: Clean staging on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 120s
          script: rm -rf /tmp/laradmin-deploy && mkdir -p /tmp/laradmin-deploy

      # ========== 上传到服务器 ==========
      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 120s
          source: "deploy_pkg/*"
          target: /tmp/laradmin-deploy
          strip_components: 1

      # ========== 服务器端：收产物 + 重启（零构建） ==========
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 120s
          # 默认 command_timeout=10m 偏紧：composer install（内层 timeout 180）+
          # dump-autoload（120）+ migrate + rsync + worker 重启，遇 packagist 慢
          # 时会撞穿 10m 被强杀（2026-09-22 21862e6 的 Deploy on server 即如此）。
          # 提到 20m 留足余量。注意：这只是兜底，根因是服务器 php8.5 缺 ext-gd
          # 导致 composer 在平台校验上空耗时间——gd 已于 2026-09-22 补装。
          command_timeout: 20m
          script: |
            set -e
            cd /www/wwwroot/laradmin

            # 0.4 nginx 代理白名单自愈：宝塔站点的 /admin 走「正则代理 + try_files 兜底」，
            #     只有显式列进正则分支的模块前缀才会被 proxy_pass 到 laravels(127.0.0.1:8000)，
            #     其余落到 try_files $uri $uri/ /admin/index.html —— 也就是 SPA 入口 index.html。
            #
            # 2026-10 事故：新增 Dashboard 模块用独立前缀 /admin/dashboard/*（其余模块都挂在
            # business/ 下），但 nginx 正则分支没加 dashboard，结果线上 /admin/dashboard/*
            # 全部返回 SPA index.html（Content-Type text/html，字节数 517，与 /admin/ 完全一致），
            # 前端 axios 拿到 HTML 解析失败 → Promise.allSettled 全部 rejected → 回退 widgets.js
            # 硬编码演示值。表象是「仪表盘全是假数据」，根因是 nginx 白名单漏了一个前缀。
            # 旧健康检查只打 /admin/auth/login，auth 在白名单里永远绿，这个断点因此逃逸上线。
            #
            # 本仓库不持有 nginx 配置（宝塔面板托管），故此处幂等自愈而非直接提交配置文件：
            # 逐个补缺则插入、有则不动，nginx -t 不过则中止部署（带着坏配置上线比中止更糟）。
            # 注意 sed 的定界符用 # 避开 location 里的 /；幂等性靠「该 token 已在分组里就跳过」保证。
            # 2026-10-14：ledger 同型事故——/admin/ledger/* GET 被 try_files 兜成 SPA index.html
            # （200 text/html），POST 由 nginx 直接 405，验收误判「后端零实现」。
            # 2026-10-30：perf / data 同型事故（QA-01 / QA-04）——绩效分析 9 页与基础档案
            # 5 页共 17 个接口全部返回 200 text/html 的 517B index.html，被报成「后端未部署」。
            # 两边代码与路由在 main 上早已齐备（perf 路由 a0c4309、data 路由 aa6c2bd），
            # 缺的只是这两个顶层前缀进白名单。路由可达性检查（见 6.5）也已一并覆盖。
            # 2026-10-31：QA-02 同型事故第三例——Cash(D1~D8)/Asset(D3~D4) 两模块用顶层前缀
            # /admin/cash/*、/admin/asset/*，白名单没跟进，11 个页面全部拿到 517B index.html，
            # 表象被记成「后端未部署」。故新增 cash / asset 两个 token。
            #
            # asset 必须写成带边界的 `asset/`，不能写裸 `asset`：分支正则 ^/admin/(a|b) 无词
            # 边界，裸 asset 会连带命中前端构建产物 /admin/assets/*.js 并 proxy_pass 进
            # Laravel → 后台整站白屏。带斜杠后只命中 /admin/asset/<子路径>，而路由表里
            # asset 全部形如 /admin/asset/{cards,depreciations,purchases,sales}，不存在裸
            # /admin/asset，故一个 token 覆盖全部且不误伤。
            # 另一层收益：本函数自己的幂等 grep 也依赖这个边界——裸 asset 会被配置里已存在
            # 的 assets 假命中，判成「白名单已含」而跳过插入，白名单实际根本没生效。
            ensure_nginx_proxy() {
              local cfg="/www/server/panel/vhost/nginx/laravel.qjwykj.com.conf"
              if [ ! -f "$cfg" ]; then echo "nginx 站点配置不存在，跳过白名单校验"; return 0; fi
              local changed=0 token
              # 2026-10-31：QA-03 同型事故——F 外围三个顶层前缀 hr（工资/提成流水）、
              #     agr（协议管理）、f5（轨迹地图/商城/短信）不在白名单里，9 个页面接口
              #     全部被兜成 index.html，表象同样是「后端未部署」。统一在此列全。
              # 2026-10-31 复核：裸 asset 会误吞 /admin/assets/*（前端构建产物）导致后台
              #     整站白屏，已由 shadow 守卫拦下，务必只留带边界的 asset/。
              #     auth/system/business 一并带边界列出：NginxProxyWhitelistTest 要求前端调用
              #     的每个顶层前缀都要有 token，AdminPrefixWhitelistTest 又要求每个 token 都挂
              #     探针，且两者都按原样 token 取数——token 与探针必须同批成对增删。
              for token in dashboard ledger perf data cash asset/ auth/ system/ business/ hr agr f5; do
                if grep -qE "location ~ \\^/admin/\\([^)]*${token}" "$cfg"; then
                  echo "nginx 代理白名单已含 $token"
                  continue
                fi
                echo "nginx 代理白名单缺 $token，插入"
                # 插到分组开头：^/admin/(auth|... → ^/admin/($token|auth|...
                sed -i "s#location ~ \\^/admin/(#location ~ ^/admin/(${token}|#" "$cfg"
                # sed 未命中（配置被宝塔重新生成为其他格式）时必须失败，不能静默成功
                grep -qE "location ~ \\^/admin/\\([^)]*${token}" "$cfg" || {
                  echo "sed 未命中，nginx 白名单格式与预期不符，需人工处理"; exit 1; }
                changed=1
              done
              if [ "$changed" != "1" ]; then return 0; fi
              grep -nE 'location ~ \^/admin' "$cfg"
              # 注意：不能把 nginx -t 放进管道（... | tail）——管道的退出码是 tail 的，
              # set -e 不会因 nginx -t 失败而中止，坏配置会被带着上线
              if ! nginx -t > /tmp/nginx-t.out 2>&1; then
                echo "nginx -t 失败："; cat /tmp/nginx-t.out; exit 1
              fi
              tail -n 2 /tmp/nginx-t.out
              nginx -s reload
            }
            ensure_nginx_proxy

            # 0.5 生产环境变量强制校验（放在所有 artisan 命令之前：config:clear 只清
            #     缓存，config:cache 会把当时的 .env 固化进 bootstrap/cache）
            #
            # .env 被 rsync 排除、跨部署保留，所以仓库模板里的 APP_DEBUG=true 会一直
            # 留在线上——线上 .env 实测就是 debug 模式，接口 500 时异常类名、堆栈、
            # 文件路径和行号会原样回给调用方（/admin/* 与 /api/* 都强制走 JSON 错误页）。
            # 以前靠人手工改，改不改全凭记得。这里每次都显式钉死。
            # 只碰 APP_ENV / APP_DEBUG / JWT_TTL 和两个密钥，不覆盖任何业务配置与凭据。
            touch .env
            ensure_env() { # 有则覆盖，无则追加
              local key="$1" value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }
            ensure_env APP_ENV production
            ensure_env APP_DEBUG false

            # JWT_TTL：480 = 8 小时。tymon 的 TTL 单位是分钟，config/jwt.php 里旧默认
            # 60*60*24*7(604800) 被当 604800 分钟 = 420 天，没设 JWT_TTL 的环境都会
            # 签发一年以上有效的 token（2026-09-15 线上实测 exp-iat=420 天）。钉死防
            # 新服务器再吃默认值。取 8 小时而非本地开发用的 120(2h)：前端没有静默
            # refresh（401 直接跳登录页），2 小时会在工作日中途把人踢下线；8 小时覆盖
            # 一个工作日后要求重登。已签发 token 不受影响（exp 写在 token 里），只
            # 作用于新登录/刷新。
            ensure_env JWT_TTL 480

            # 缺密钥就直接中止，不在线上一边跑一边生成：APP_KEY 空值会让所有加解密与
            # 签名抛错，JWT_SECRET 空值会让每条鉴权路由都失败。生成的值写进 .env 后
            # 就固定在线上，后续部署不再重复生成（不覆盖已存在的非空值）。
            if ! grep -qE '^APP_KEY=.+$' .env; then
              ensure_env APP_KEY "base64:$(head -c 32 /dev/urandom | base64)"
              echo "generated APP_KEY"
            fi
            if ! grep -qE '^JWT_SECRET=.+$' .env; then
              ensure_env JWT_SECRET "$(head -c 32 /dev/urandom | base64)"
              echo "generated JWT_SECRET"
            fi

            # 钉错了就让部署明确失败，而不是带着 debug 模式上线
            grep -q '^APP_ENV=production$' .env   || { echo "APP_ENV 未生效"; exit 1; }
            grep -q '^APP_DEBUG=false$'  .env     || { echo "APP_DEBUG 未生效"; exit 1; }
            grep -q '^JWT_TTL=480$'      .env     || { echo "JWT_TTL 未生效"; exit 1; }

            # 0. 备份当前前端产物（storage 不参与 rsync --delete，可安全存放上一版，
            #    健康检查失败时回滚用）
            rm -rf storage/admin.prev
            if [ -d public/admin ]; then cp -r public/admin storage/admin.prev; fi

            # 1. 同步源码（排除运行态目录与前端产物；--delete 保持与仓库一致）
            #    public/admin 由步骤 4 用 dist 原子替换，不参与 rsync --delete：
            #    若让它参与，线上前端会在替换就绪前被清空，一旦中途任一步骤
            #    （package:discover / migrate）失败，public/admin 就停在空目录
            #    状态却被健康检查标绿——正是本次线上 /admin/* 全 404 的形态。
            rsync -a --delete --exclude .env --exclude storage --exclude vendor \
              --exclude node_modules --exclude .git --exclude public/admin \
              /tmp/laradmin-deploy/source/ /www/wwwroot/laradmin/

            # 2. 后端依赖：显式用探测到的 PHP 执行 composer——部署 CLI 与 laravels worker 统一运行时
            #    （swoole/pcntl 需求已在 composer.json config.platform 伪造，解析不依赖执行 composer 的 PHP 是否带这些扩展）
            #    探测顺序：php8.5（与 worker 同运行时）→ 默认 php → 兜底绝对路径；避免硬编码在重装/换版本后 command not found(exit 127)
            PHP_BIN="$(command -v php8.5 || command -v php || echo /usr/bin/php8.5)"
            COMPOSER_BIN="$(command -v composer || echo composer)"
            timeout 180 "$PHP_BIN" "$COMPOSER_BIN" install --no-dev --no-interaction --optimize-autoloader || true
            timeout 120 "$PHP_BIN" "$COMPOSER_BIN" dump-autoload -o || true

            # 2.5 硬性门槛：应用必须能完整 boot（package:discover 会加载全部包提供者）。
            #     此步失败说明 vendor/配置不一致（如残留已删除的包引用），此时继续部署
            #     只会全线 500 —— 立即中止，worker 未 reload 仍在跑旧代码，站点不受影响。
            "$PHP_BIN" artisan package:discover --ansi

            # 3. 迁移 + 清缓存
            # 注意：route:cache 在本环境被禁用——生成的缓存路由在 laravel-s worker
            # 内 dispatch 即 fatal（2026-09-13 生产 500 事故，/up 404 + 其余路由空
            # body 500），worker 的运行时与 CLI 不一致，未定位前不得开启
            "$PHP_BIN" artisan migrate --force
            "$PHP_BIN" artisan config:clear 2>/dev/null || true
            "$PHP_BIN" artisan route:clear 2>/dev/null || true
            "$PHP_BIN" artisan view:clear 2>/dev/null || true
            "$PHP_BIN" artisan cache:clear 2>/dev/null || true

            # 4. 原子替换前端产物（云端构建好的）
            #    先落 public/admin.new 并校验 index.html 存在，再 mv 切换：
            #    dist 为空（CI 构建失败 / scp 上传缺失）时不动线上目录，并令部署
            #    明确失败——宁可红，也不要空着 public/admin 还被健康检查标绿。
            rm -rf public/admin.new
            cp -r /tmp/laradmin-deploy/dist public/admin.new
            chown -R root:root public/admin.new
            if [ ! -f public/admin.new/index.html ]; then
              echo "dist 为空（缺 index.html）— 中止，保留现有 public/admin"
              rm -rf public/admin.new
              exit 1
            fi
            rm -rf public/admin
            mv public/admin.new public/admin

            # 5. 完整重启（不用 reload）。
            #    关键教训：worker/timer/task 进程由 master fork 而来，继承 master 的
            #    内存状态——包括启动时加载的 Composer autoloader。凡涉及依赖变更
            #    （composer install / autoload files 调整）的部署，reload 后 fork 出的
            #    子进程仍携带旧 autoloader，新加的 autoload files（如 mb_polyfill）永远
            #    不生效，且无任何报错。必须重启 master 才能拿到全新运行时。
            #    journal 实证 restart 为秒级操作，中断窗口可接受。
            systemctl restart laravels || "$PHP_BIN" bin/laravels restart

            # 5.5 部署后诊断：CLI 与 worker 已统一为探测到的 PHP，此处验证 mb 兜底仍然生效
            #     直接用同一 PHP_BIN 验证 mb 兜底函数是否已随 autoload 生效
            "$PHP_BIN" -v 2>/dev/null | head -n 1 || echo "PHP_BIN not found"
            "$PHP_BIN" -m 2>/dev/null | grep -ci "^mbstring$" || echo "mbstring NOT loaded"
            "$PHP_BIN" -r "require 'vendor/autoload.php'; var_dump(function_exists('mb_split'), function_exists('mb_strimwidth'), function_exists('mb_strlen'));" 2>&1 | tail -n 4
            grep -c "mb_polyfill" vendor/composer/autoload_files.php 2>/dev/null || echo "shim NOT in autoload_files"
            echo "--- PHP 完整 boot 测试（真实 worker 环境）---"
            "$PHP_BIN" artisan route:list --path=api 2>&1 | head -n 15 || true
            echo "--- PHP 扩展清单 ---"
            "$PHP_BIN" -m 2>/dev/null | tr '\n' ' ' | head -c 800; echo
            echo "--- worker 配置来源 ---"
            grep -E "LARAVELS_WORKER_NUM|LARAVELS_TASK" .env 2>/dev/null || echo ".env 无 worker 配置"
            echo "--- systemd 日志中的 worker fatal ---"
            journalctl -u laravels -n 25 --no-pager 2>/dev/null | tail -n 25 || true

            # 6. 深度健康检查：登录接口返回 2xx-4xx（422 校验错误=应用健康）才算存活；
            #    5xx 或无响应视为失败（500 曾被误判为存活，导致坏部署标绿——教训）
            sleep 3
            ok=0
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
                -X POST https://laravel.qjwykj.com/admin/auth/login \
                -H "Content-Type: application/json" -d '{}' || echo 000)
              if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
                echo "health: ok (HTTP $code)"; ok=1; break
              fi
              echo "health: retry $i (HTTP $code)"; sleep 5
            done

            if [ "$ok" != "1" ]; then
              echo "health: FAILED — 输出应用错误日志以便定位"
              tail -n 60 storage/logs/laravel.log 2>/dev/null || true
              echo "--- swoole log（worker fatal 写在这里）---"
              tail -n 40 "storage/logs/swoole-$(date +%Y-%m).log" 2>/dev/null || true
              echo "health: FAILED — 回滚前端产物并重启服务"
              rm -rf public/admin
              if [ -d storage/admin.prev ]; then mv storage/admin.prev public/admin; fi
              "$PHP_BIN" bin/laravels reload || systemctl restart laravels || true
              exit 1
            fi

            # 6.5 模块路由可达性检查：上面只验了 auth/login，那它在 nginx 白名单里、永远绿，
            #     于是 /admin/dashboard/* 被 try_files 兜成 SPA index.html 的事故一路标绿上线。
            #     此步用「不带 token 打业务接口、只看 Content-Type」做无凭据探测：
            #     正确代理 → Laravel 返回 401 application/json（路由存在）；
            #     被 try_files 兜底 → 200 text/html（index.html），即模块前缀漏配。
            #     返回 JSON 即算健康，不关心具体状态码（401=未登录属正常）。
            # 探测五个前缀：dashboard 是 2026-10 事故的元凶（新顶层前缀漏配），
            # business 覆盖 office 模块的 mail/notice/messages（messages 于 2026-10-15
            # 从顶层改挂 business/ 以进白名单）；ledger 是总账模块顶层前缀
            # （2026-10-14 漏配导致 /admin/ledger/* 全部被 try_files 兜成 HTML，
            # 验收误判「后端零实现」——content-type 探测就是给这类事故上的保险）。
            # perf / data 是 QA-01 / QA-04（2026-10-30）漏配的两个顶层前缀：探针与
            # ensure_nginx_proxy 必须同步覆盖，否则「白名单补了、探针没补」下次照样静默回归。
            # 任一被 try_files 兜成 HTML 即判失败——否则整个模块静默失效而部署标绿。
            # 2026-10-31：补 cash / asset 两个前缀（QA-02 元凶）。这两个前缀此前只被
            # ensure_nginx_proxy 自愈，不在探测名单里，故「自愈没跑成」也不会红。
            # 2026-10-31 再补 auth / system：二者进了 token 列表就必须成对挂探针
            # （AdminPrefixWhitelistTest 守这条），否则漏配时部署仍是绿的。
            route_ok=1
            for path in dashboard/core-metrics business/notice ledger/subjects hr/payrolls agr/agreements f5/sms/templates perf/commission-rules data/company cash/accounts/options asset/cards auth/me system/attachment; do
              ok=0 ct=''
              for i in 1 2 3; do
                ct=$(curl -s -o /dev/null -w "%{content_type}" --max-time 10 \
                  "https://laravel.qjwykj.com/admin/$path" \
                  -H "Accept: application/json" || echo error)
                if echo "$ct" | grep -q "json"; then ok=1; break; fi
                echo "route: retry $i (/admin/$path → $ct)"; sleep 5
              done
              if [ "$ok" = "1" ]; then
                echo "route: ok (/admin/$path → $ct)"
              else
                echo "route: FAILED — /admin/$path 未代理到 Laravel（疑 nginx 白名单漏配）"
                route_ok=0
              fi
            done

            if [ "$route_ok" != "1" ]; then
              echo "--- 当前 nginx 代理白名单 ---"
              grep -nE 'location ~ \^/admin' /www/server/panel/vhost/nginx/laravel.qjwykj.com.conf 2>/dev/null || true
              echo "route: FAILED — 回滚前端产物并重启服务"
