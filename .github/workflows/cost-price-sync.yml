# 一次性成本价同步：用联凯 products_all.json 的 cb_jg 替换 products.cost_price。
# 触发方式：手动 workflow_dispatch（不在 push 上自动跑——是数据回填，跑一次即可，
# 幂等可重跑）。依赖：先有一次普通 Build & Deploy 把命令 + 数据文件部署到服务器。
# 连库方法即 DEPLOY.md 里的 SSH（appleboy/ssh-action + SERVER_SSH_KEY secret）。
name: Cost Price Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Run sync command on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /www/wwwroot/laradmin

            echo "=== 1. 核对（dry-run，不写入）==="
            php8.5 artisan business:sync-cost-prices --dry-run

            echo
            echo "=== 2. 替换不一致的行（按 external_id 匹配，仅更新不一致的）==="
            php8.5 artisan business:sync-cost-prices
