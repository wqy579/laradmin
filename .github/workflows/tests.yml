# =============================================================================
# Tests — CI 质量门禁
#
# 设计目标：把 deploy.yml 里才暴露的问题提前拦下来。目前共 5 个 job，全部并行：
#   secrets   防泄漏（秒级，最快的失败信号）
#   static    PHP 静态检查（不连数据库）
#   phpunit   单元 + 功能测试（MySQL 服务容器）
#   swoole    Swoole worker 探活（PHP 8.5，CI 里唯一能验证 laravel-s 运行时的门）
#   frontend  前端构建（与 deploy.yml 同一条命令，行为不漂移）
#
# 分支保护建议：Required checks 勾 secrets / static / phpunit 三项（frontend 会随
# 前端依赖波动，先不作硬门槛）。
#
# ⚠️ 改动本文件前必读：job 的 id（secrets / static / phpunit / frontend）就是分支
# 保护里勾的 required check 名。改 id 会让已经配好的分支保护失效、甚至把 main
# 锁死（required check 永远处于 missing 状态）。只改 name: 那一行的显示名。
# 同理，push 本文件需要带 workflow 权限的 Token（见 DEPLOY.md 三.2），或者直接在
# GitHub 网页上编辑——这两条是「改不动 tests.yml」时最可能的原因。
# =============================================================================
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 默认只读权限：workflow 本身不做任何写操作。显式收窄比留空更安全——留空时按仓库
# settings 拿 permissions，一旦有人把 Actions 权限放宽就会被动继承。
# upload-artifact 走 ACTIONS_RUNTIME_TOKEN，不需要 contents:write。
permissions:
  contents: read

# ⚠️ 不要加顶层 timeout-minutes。GitHub 会拒绝解析整个 workflow，表现为
# conclusion=failure、jobs=[]、耗时 0s——一个 job 都跑不起来，且 run log 里查不到
# 原因（annotations 接口 404）。本仓库 8 次历史运行全部如此，tests.yml 从未真正执行过。
# 对照：deploy.yml 没有这个键，每次都正常跑完。API 报错位置为
#   Line: 35, Col: 1: Unexpected value 'timeout-minutes'
# 各 job 已各自设有更紧的 timeout-minutes（3 / 10 / 15 / 15），总时长已被限制在
# 4 个 job 并行下的最大值 15 分钟，不需要顶层兜底。

# 同一分支的旧运行直接取消，避免排队空跑。deploy.yml 也是 main 触发的，用独立的
# group 名，互不等待。
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========== 防泄漏门禁 ==========
  # 历史上这个仓库出过两件事：.env.testing 一度被提交（.gitignore 里 .env.* 挡不住
  # git add -f），以及工作区里长期存在含 Gitee token / 数据库密码的 red.md。这里做成
  # 机器检查，靠人看 git status 迟早会漏。
  #
  # 第二组检查（构建产物）守的是同一个洞：git add -f 一样能绕过 .gitignore 把
  # public/admin 塞进仓库。而 pre-commit / pre-push 钩子是 opt-in 的（要手动执行
  # git config core.hooksPath .githooks），CI 里根本没有本地钩子，所以这份名单必须
  # 在流水线里再落一份，否则「产物入库」只能靠每个人本地都配好了钩子来保证。
  secrets:
    name: Leak guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Refuse tracked secrets
        shell: bash
        run: |
          set -euo pipefail

          # .env / .env.testing / .env.ci-check … 一律不许入库，.env.example 除外。
          # git ls-files 输出的根目录文件没有前导斜杠，排除 .env.example 时也要用
          # (^|/) 前缀，否则根目录的 .env.example 自己会把这一步打成红。
          hits=$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$hits" ]; then
            echo "::error title=Sensitive file tracked::$(echo "$hits" | tr '\n' ' ')"
            echo "以下文件已纳入版本控制（.env.example 除外）："
            echo "$hits"
            echo "修复：git rm --cached <file> 并确认 .gitignore 覆盖它"
            exit 1
          fi

          # 密钥文件、凭据文件与本地运维笔记
          hits=$(git ls-files | grep -Ei '(^|/)(red\.md|id_rsa|\.netrc|\.pgpass|\.npmrc|\.envrc)$|\.pem$|\.p12$|\.pfx$|\.jks$' || true)
          if [ -n "$hits" ]; then
            echo "::error title=Secret-looking file tracked::$(echo "$hits" | tr '\n' ' ')"
            echo "$hits"
            exit 1
          fi

      - name: Refuse tracked build artifacts
        shell: bash
        run: |
          set -euo pipefail
          # 「源码入库 + 云端构建」是本仓库的地基（见 DEPLOY.md 七.1）：public/admin
          # 由 workflow 云端 build 出来后 scp 到线上。产物一旦入库，deploy.yml 会把它
          # 原样 cp 到服务器——源码改了，线上跑的仍是旧产物，而且不会有任何报错。
          #
          # 名单与 .gitignore、.githooks/pre-push 三处保持一致，改一处必须同步另两处。
          # 故意不含 storage/：仓库里有 14 个被跟踪的 storage 骨架文件（各子目录的
          # .gitignore 占位 + storage/data/*.csv 种子数据 + modules_statuses.json）。
          hits=$(git ls-files | grep -E '^(public/admin/|public/assets/|public/index\.html$|frontend/dist/|node_modules/|vendor/)' || true)
          if [ -n "$hits" ]; then
            echo "::error title=Build artifact tracked::$(printf '%s\n' "$hits" | wc -l) 个构建产物已入库"
            echo "本仓库只收源码，产物由云端 workflow 生成。已入库的产物："
            echo "$hits"
            echo "修复：git rm -r --cached <path>   # 保留本地文件，仅从版本控制移除"
            echo "      然后确认 .gitignore 覆盖该路径，再重新提交"
            exit 1
          fi

      - name: Verify .gitignore still covers env files
        shell: bash
        run: |
          set -euo pipefail
          for pat in '.env' '.env.*' '!.env.example'; do
            if ! grep -qxF "$pat" .gitignore; then
              echo "::error title=gitignore gap::.gitignore 缺少 \"$pat\"，.env 类文件可能被提交"
              exit 1
            fi
          done

      - name: Verify .gitignore still covers build artifacts
        shell: bash
        run: |
          set -euo pipefail
          # 上面两步是「现在有没有漏」，这一步是「以后会不会漏」：有人为了排查问题
          # 临时放宽 .gitignore，下次就会真的把产物提上去。用 qxF 做整行匹配，
          # 避免被注释或行内空格骗过。
          for pat in 'vendor/' 'frontend/node_modules/' 'frontend/dist/' 'public/admin/'; do
            if ! grep -qxF "$pat" .gitignore; then
              echo "::error title=gitignore gap::.gitignore 缺少 \"$pat\"，构建产物可能被提交"
              exit 1
            fi
          done

  # ========== 静态检查：不连数据库，与 phpunit 并行，失败定位更快 ==========
  static:
    name: Static checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 生产运行时是 8.5（见 deploy.yml），composer.json config.platform 又是 8.3.0
        # （maatwebsite/excel 4.x 要求 php ^8.3，代码下限已到 8.3）——两个都测，
        # 才能同时挡住「新版本 API 变化」和「依赖解析漂移」。
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # mbstring/pdo_mysql：框架与 maatwebsite/excel 依赖；
          # intl/zip：phpspreadsheet 强依赖；opcache：贴近 LaravelS 常驻 worker 的加载方式
          extensions: mbstring, pdo_mysql, intl, zip, opcache, bcmath
          coverage: none
          tools: composer:v2
          # setup-php 内置缓存（key 含 PHP 版本，两个矩阵各自命中），
          # 不需要再单独挂 actions/cache
          cache: composer

      - name: Install dependencies
        # --no-scripts：跳过 package:discover（需要 boot 应用 + APP_KEY），
        # 静态检查用不上，省一次 artisan 冷启动
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Verify composer.lock is in sync
        # 只改 composer.json 不提交 lock：install 会静默改写 lock 并给一句 warning，
        # 线上却会装到另一套依赖。看工作区有没有被改动是最直接的证据。
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          if ! git diff --exit-code -- composer.lock; then
            echo "::error title=Lockfile out of sync::composer.json 改了但 composer.lock 没提交，线上会装到另一套依赖"
            git diff -- composer.lock | head -n 40
            exit 1
          fi

      - name: Check platform requirements
        # 上一版这里挂着 `|| true`，是一条永远绿的假门禁（步骤名还写着 lockfile）。
        # 去掉 || true，让它真的能拦住「本地缺扩展但 CI 没发现」。
        #
        # ⚠️ 这条命令忽略 composer.json 的 config.platform。composer 自己的说明：
        #   Unlike update/install, this command will ignore config.platform settings
        #   and check the real platform packages.
        # 所以 config.platform 里的 php: 8.3.0 只影响依赖解析，不影响这一步——这里验的
        # 是矩阵里真实的 PHP 版本。别把「config.platform 已伪造 php」当成这里的安全感。
        #
        # 2026-09-15 因此红过一次：lcobucci/jwt 4.0.4 依赖 lcobucci/clock 2.3.0，后者
        # 声明 php (~8.1.0 || ~8.2.0)，PHP 8.5 矩阵格永久 failed；而同批 PHPUnit (8.5)
        # 全绿、migrate:fresh 也过——是声明约束不匹配，不是 8.5 跑不动。旧的注释正是
        # 误判了这一点。修法是升 lcobucci/jwt 到 5.6.0（tymon/jwt-auth 2.3.0 允许
        # ^4.0|^5.0，无需改它），clock 2.x 随之从依赖树消失。
        run: composer check-platform-reqs --no-dev

      - name: Lint PHP syntax
        # 目录清单必须与仓库实际结构一致。上一版 find 的报错会被管道后的 xargs 吞掉
        # 退出码，目录不存在时只刷屏不失败。这里显式断言目录存在，且断言真的扫到了文件。
        shell: bash
        run: |
          set -euo pipefail
          for d in app bootstrap config database modules public resources routes stubs tests; do
            [ -d "$d" ] || { echo "::error title=Missing directory::$d"; exit 1; }
          done
          # modules 是模块化改造后的业务代码主体，漏掉它等于最大一块不检查
          mapfile -d '' files < <(find app bootstrap config database modules \
                                  public resources routes stubs tests -name '*.php' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=Nothing to lint::没扫到任何 PHP 文件，find 参数可能错了"
            exit 1
          fi
          printf '%s\0' "${files[@]}" | xargs -0 -n1 php -l
          echo "linted ${#files[@]} files"

      # 代码风格：全仓库已按 Pint 默认 preset（PSR-12/Laravel）全量格式化，
      # pint --test 全绿，现为硬门禁——风格回归直接阻断合码。
      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      # 依赖漏洞：composer.json 里 policy.advisories.block 是 false（解析时不阻断，
      # 保证 composer install 永不因漏洞退出），所以门禁得单独挂这条命令。
      # composer audit 现已无已知漏洞（近期 Laravel 12 / jwt 5.x / excel 4.x 升级清债），
      # 转为硬门禁——新增高危依赖会被阻断合码。
      - name: Audit dependencies (Composer)
        run: composer audit --no-interaction --no-ansi

  # ========== 单元测试 / 功能测试 ==========
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']

    # 测试库是 MySQL，理由是严格度，不是迁移语法。
    # 曾记录的理由「迁移含 MySQL 专有语法、SQLite 无法执行」已核实为假：
    # 全量迁移里搜不到 ON DUPLICATE KEY UPDATE / ENGINE= / FULLTEXT / MODIFY COLUMN 等
    # 任何 MySQL 专有构造，SQLite 跑全量测试是 76/76 全绿的。
    #
    # 真正需要 MySQL 的是严格模式。实测抓过一个只有 MySQL 会暴露的缺陷：
    # StockService::statistics() 里 whereColumn('quantity', '<', 10) 把 10 当列名，
    # MySQL 报 SQLSTATE[42S22] Unknown column '10'（接口直接 500），
    # SQLite 因类型亲和性把 10 当字面量、照常通过。换成 SQLite 当门槛会把这个漏掉。
    # 所以别把主门槛改成 SQLite——它快，适合本地迭代，但不适合当唯一门禁。
    #
    # 想覆盖 8.4（生产 MySQL 版本待确认）时，把下面 image 提成 matrix 即可：
    #   strategy.matrix.mysql: ['8.0', '8.4']  +  image: mysql:${{ matrix.mysql }}
    # 这里先只跑 8.0，避免 8.4 默认关闭 mysql_native_password 带来的认证差异制造噪音。
    services:
      mysql:
        image: mysql:8.0
        # --health-*：确保 php artisan migrate 运行时服务已就绪，避免随机连不上
        #
        # ⚠️ options 里只能放 docker create 的 flag。这里曾经写过
        #   --character-set-server=utf8mb4
        #   --collation-server=utf8mb4_unicode_ci
        # 那是 mysqld 的启动参数，不是 docker 的 flag。docker 直接报
        #   unknown flag: --character-set-server   （exit code 125）
        # 容器建不起来，整个 phpunit job 在「Initialize containers」阶段就死掉，
        # 一步测试都没跑到。services 没有 command 键，服务端参数无处可传，所以
        # 只能删掉。
        #
        # 删掉不损失 utf8mb4 覆盖：MySQL 8.0 的默认 character_set_server 就是
        # utf8mb4、默认 collation 是 utf8mb4_0900_ai_ci。原来的「与生产一致」这个
        # 意图改由下面的 Assert utf8mb4 server charset 一步显式断言——不再依赖
        # 一条静默失效的 flag。
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        env:
          # 用专用账号而不是 root：root 默认只允许 localhost，宿主机经 3306 端口连过去
          # 是 root@10.x.x.x，会直接 Access denied
          MYSQL_ROOT_PASSWORD: rootp…2026
          MYSQL_DATABASE: laradmin_test
          MYSQL_USER: laradmin
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306

    # 整个 job 统一的环境变量：
    # phpunit.xml 的 <env> 节点里 DB_CONNECTION 写的是 sqlite，但 force 默认 false——
    # 已存在的真实环境变量优先，所以上面这份会覆盖成 MySQL。这里显式重复 CACHE/SESSION/
    # QUEUE 等值，是防止有人删掉 phpunit.xml 的 <env> 后测试悄悄开始连 Redis/文件队列。
    # 下面几行全是 CI 专用的测试库凭据（容器里现建现删），不是生产密钥。
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: laradmin_test
      DB_USERNAME: laradmin
      DB_PASSWORD: secret
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      # JWT_SECRET 不在这里写死：曾提交过被截断成 13 字节的假密钥（104 bits，签发 token
      # 直接抛 "Key provided is shorter than 256 bits"），且 job env 变量会覆盖
      # .env.testing 里的值。密钥改由下面 Prepare 步骤随机生成写进 .env.testing，
      # 与 APP_KEY 同法。

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, intl, zip, opcache, bcmath
          coverage: none
          tools: composer:v2
          cache: composer

      # 先准备好测试环境，再装依赖：composer 的 post-autoload-dump 会跑 package:discover，
      # 需要 APP_KEY，此时 .env.testing 必须已经存在（.env.testing 被 .gitignore 忽略）
      - name: Prepare test env
        shell: bash
        run: |
          set -euo pipefail
          test -f .env.example \
            || { echo "::error title=Missing .env.example::测试环境依赖 .env.example，但它不在仓库里"; exit 1; }
          cp .env.example .env.testing
          # .env.example 里 APP_KEY= 是空值。不能靠 append：dotenv 不覆盖已存在的键，
          # 末尾再加一行等于没写，任何做加解密/签名签名的测试都会抛
          # "No application encryption key has been specified"。这里直接改那一行。
          # 分隔符用 # 而不是 /：base64 字符集里含 /，用 / 作分隔符时随机命中的
          # 密钥会让 sed 直接报 "unknown option to `s'"
          sed -i "s#^APP_KEY=.*#APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')#" .env.testing
          grep -q '^APP_KEY=base64:' .env.testing || {
            echo "::error title=Missing APP_KEY::.env.testing 没有生成 APP_KEY"
            exit 1
          }
          # JWT_SECRET 同理：.env.example 里是空值，而 tymon/jwt-auth 要求 ≥256 位密钥。
          # 空值/过短都会让所有走 JWT 签名的测试抛 JWTException。同法随机生成——
          # base64(32B) 保证 ≥256 位，且每次运行密钥都是新鲜的，不再有「写死的假密钥
          # 悄悄截断、只改 workflow 不查测试」这一类坑（2026-09-16 CI 首跑即被它打红）。
          sed -i "s#^JWT_SECRET=.*#JWT_SECRET=$(php -r 'echo base64_encode(random_bytes(32));')#" .env.testing
          grep -q '^JWT_SECRET=.' .env.testing || {
            echo "::error title=Missing JWT_SECRET::.env.testing 没有生成 JWT_SECRET"
            exit 1
          }
          mkdir -p build

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # MySQL 8.0 默认字符集断言。services.mysql 的 options 里曾经用
      # --character-set-server=utf8mb4 来「与生产保持一致」，但那两个 flag 会让 docker
      # create 直接报 unknown flag、容器根本建不起来（见上方注释），等于这条约束从来没
      # 生效过。flag 删掉后，「CI 一定是 utf8mb4」从一条静默失效的 flag 变成这里一条
      # 显式断言——将来若把 image 退回 mysql:5.7（默认 latin1），这一步会立刻变红，
      # 而不是等到线上中文/emoji 写入才暴露。
      # 用 PDO 而不是 mysql 客户端：ubuntu runner 不保证装了 mysql client，PHP 必装，
      # 而且和测试用的是同一条连接路径。
      - name: Assert utf8mb4 server charset
        shell: bash
        run: |
          set -euo pipefail
          php -r '$pdo = new PDO(sprintf("mysql:host=%s;port=%s;dbname=%s", getenv("DB_HOST"), getenv("DB_PORT"), getenv("DB_DATABASE")), getenv("DB_USERNAME"), getenv("DB_PASSWORD"));
            $cs = $pdo->query("SELECT @@character_set_server")->fetchColumn();
            $col = $pdo->query("SELECT @@collation_server")->fetchColumn();
            if ($cs !== "utf8mb4") { fwrite(STDERR, "::error title=Wrong server charset::character_set_server={$cs}，期望 utf8mb4\n"); exit(1); }
            echo "character_set_server={$cs}  collation_server={$col}\n";'

      # 独立于测试的迁移冒烟检查：RefreshDatabase 只在测试真的碰数据库时才会跑迁移，
      # 一旦有人新加迁移但没写测试，只有这一步能兜住「迁移写崩但 CI 全绿」的情况
      - name: Migration smoke test
        run: php artisan migrate:fresh --force

      - name: Run PHPUnit
        # --log-junit：即使测试通过也留一份机器可读的结果，便于以后接测试报告
        run: php artisan test --colors=always --log-junit=junit.xml

      # 失败时留证据：swoole/worker 的 fatal 不会打到 stdout，只能翻日志
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-php${{ matrix.php }}
          path: |
            junit.xml
            build/*
            storage/logs/*.log
            bootstrap/cache/*.php
          if-no-files-found: ignore
          retention-days: 14

  # ========== Swoole worker 探活 ==========
  # 为什么需要：生产跑在 laravel-s（swoole 常驻 worker）上，CLI 全绿不等于 worker 内
  # 能 dispatch 请求——2026-09-13 生产 500 事故就是 route:cache 的缓存路由在 worker 内
  # fatal、CLI 完全正常（deploy.yml 第 3 步因此禁用 route:cache）。本地四个 PHP 都没装
  # swoole/phpize，boot 不了 worker，所以 CI 是唯一能验证「laravel-s + 当前框架版本在
  # worker 里处理请求」的地方。升级框架（如这次的 Laravel 12）必须先让这里绿。
  #
  # 职责边界：只探 HTTP 请求生命周期（boot → middleware → 路由 → 422）。不测
  # websocket/timer/inotify——它们是配置驱动的旁路，Laravel 12 下若有兼容问题会在部署
  # 健康门（deploy.yml 第 6 步）暴露；这里关掉它们让探活聚焦、少一个变量。
  #
  # 矩阵为什么只有 8.5：生产 worker 就是 8.5（DEPLOY.md 运行时表）。依赖漂移已有
  # static/phpunit 的 8.2 矩阵覆盖，这个 job 的唯一目的就是复刻生产 worker——跑 8.2
  # 只会多一次 swoole 源码编译，却测不到生产路径。
  swoole:
    name: Swoole worker probe (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    env:
      APP_ENV: testing
      # 探活只打「登录 422」这条无 DB 路由（validation 在查库之前），sqlite 比 MySQL
      # 容器轻；数组存储避开 Redis/文件队列。worker 内 fatal 与存储引擎无关，DB 正确性
      # 由 phpunit 的 MySQL 矩阵负责。
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      # 端口/绑定与生产（8000 / 0.0.0.0）分开：runner 上 8000 可能被占，且探活不该
      # 暴露到容器外。config/laravels.php 全吃 env，改这里即生效。
      LARAVELS_LISTEN_IP: 127.0.0.1
      LARAVELS_LISTEN_PORT: '8099'
      LARAVELS_DAEMONIZE: 'false'
      # 见上方「职责边界」：关掉旁路，只留 HTTP。
      LARAVELS_WEBSOCKET: 'false'
      LARAVELS_TIMER: 'false'
      LARAVELS_INOTIFY_RELOAD: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # swoole 是重点：setup-php 在 PHP 8.5 下从源码编译最新稳定版，耗时较长，
          # 故 timeout 放到 20 分钟。pcntl：laravel-s 依赖。pdo_mysql 保留是贴近生产
          # worker 的扩展面；pdo_sqlite 供探活用的 sqlite 连接。
          extensions: swoole, pcntl, pdo_sqlite, mbstring, pdo_mysql, intl, zip, opcache, bcmath
          coverage: none
          tools: composer:v2
          cache: composer

      - name: Prepare test env
        shell: bash
        run: |
          set -euo pipefail
          # 与 phpunit job 同法：.env.example 里 APP_KEY 为空，从随机字节生成。
          # laravel-s start 会先跑 artisan laravels config（完整 app boot），没有
          # APP_KEY 会抛 "No application encryption key has been specified"。
          test -f .env.example \
            || { echo "::error title=Missing .env.example::"; exit 1; }
          cp .env.example .env.testing
          sed -i "s#^APP_KEY=.*#APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')#" .env.testing
          grep -q '^APP_KEY=base64:' .env.testing \
            || { echo "::error title=Missing APP_KEY::.env.testing 没有生成 APP_KEY"; exit 1; }
          # JWT_SECRET 与 APP_KEY 同法随机生成（.env.example 里为空）。worker 里
          # FlushRequestState::flush() 每个请求前都会 resolve 'tymon.jwt'，空密钥直接抛
          # "Secret is not set" → 所有请求 500（2026-09-16 swoole job 首跑正是死在这）。
          sed -i "s#^JWT_SECRET=.*#JWT_SECRET=$(php -r 'echo base64_encode(random_bytes(32));')#" .env.testing
          grep -q '^JWT_SECRET=.' .env.testing \
            || { echo "::error title=Missing JWT_SECRET::.env.testing 没有生成 JWT_SECRET"; exit 1; }

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Boot Swoole worker
        shell: bash
        run: |
          set -euo pipefail
          # daemonize=false 时 laravel-s 的 start 前台阻塞（Portal::start →
          # LaravelS->run()），必须 & 后台化并记 PID，由 Stop 步骤回收。
          php bin/laravels start > storage/logs/swoole-ci.log 2>&1 &
          echo $! > /tmp/laravels.pid
          # 等 worker 开始接受连接：任何 HTTP 响应（含 404）都说明已在服务；
          # 连接拒绝说明还没就绪；进程退出说明 boot 期间就 fatal，直接留证。
          for i in $(seq 1 30); do
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:8099/; then
              echo "worker accepting connections after ${i}s"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/laravels.pid)" 2>/dev/null; then
              echo "::error title=Swoole worker died during boot::进程已退出"
              tail -n 80 storage/logs/swoole-ci.log || true
              exit 1
            fi
            sleep 1
          done
          echo "::error title=Swoole worker did not boot::30s 内 127.0.0.1:8099 无响应"
          tail -n 80 storage/logs/swoole-ci.log || true
          exit 1

      - name: Probe request lifecycle (production health-check parity)
        shell: bash
        run: |
          set -euo pipefail
          # 与 deploy.yml 第 6 步同判据：空 body POST 登录，422（校验错误）=应用健康，
          # 5xx 或无响应=worker 内 fatal（2026-09-13 事故的判据）。唯一区别是内网直连
          # worker 端口，不经 CDN/nginx。
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            -X POST http://127.0.0.1:8099/admin/auth/login \
            -H "Content-Type: application/json" -d '{}' || echo 000)
          echo "login probe -> HTTP $code"
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            echo "::error title=Swoole worker unhealthy::HTTP $code（期望 2xx/4xx；5xx 或无响应=worker fatal）"
            tail -n 80 storage/logs/swoole-ci.log 2>/dev/null || true
            tail -n 40 "storage/logs/swoole-$(date +%Y-%m).log" 2>/dev/null || true
            exit 1
          fi

      - name: Stop Swoole worker
        if: always()
        shell: bash
        run: |
          # bin/laravels stop 走 pid 文件（Portal::stop，SIGTERM 给 master），kill 兜底；
          # 就算 worker 泄漏也无所谓——runner 每 job 独立销毁。
          php bin/laravels stop >/dev/null 2>&1 || true
          [ -f /tmp/laravels.pid ] && kill "$(cat /tmp/laravels.pid)" 2>/dev/null || true

      # worker 的 fatal 不打 stdout（生产教训，见 deploy.yml 第 5.5 步），
      # 失败时把 swoole log 留档。
      - name: Upload swoole logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swoole-probe-logs-php${{ matrix.php }}
          path: |
            storage/logs/*.log
            bootstrap/cache/*.php
          if-no-files-found: ignore
          retention-days: 14

  # ========== 前端构建：deploy.yml 目前把 build 塞在部署 job 里，
  # 构建失败只能在部署阶段才暴露，这里提前拦截 ==========
  frontend:
    name: Frontend build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 生产用 20（见 deploy.yml）；22 一并跑，防止升级后被依赖引擎范围绊住
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # package.json 的 build 脚本会顺带把产物拷进 ../public/admin，
      # 与 deploy.yml 的云端构建步骤完全同一条命令，行为不会漂移。
      # 注意 mkdir -p 必须保留：public/admin 被 gitignore，CI 里 clone 下来是不存在的，
      # 而 cp -r dist/* 的目标目录不存在会直接报 "No such file or directory"。
      - name: Build
        working-directory: frontend
        run: |
          mkdir -p ../public/admin
          npm run build

      # deploy.yml 把 public/admin 原样 cp 到线上；构建产物为空（vite 配置回归）时
      # 部署依然会成功，只是站点变成白屏。这里直接断言产物存在且非空。
      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          test -f public/admin/index.html \
            || { echo "::error title=No build output::public/admin/index.html 不存在"; exit 1; }
          kb=$(du -sk public/admin | cut -f1)
          echo "public/admin = ${kb}KB"
          [ "$kb" -gt 10 ] \
            || { echo "::error title=Build output too small::疑似空构建"; exit 1; }

      # 格式化：仓库里已有 format 脚本但没人跑，先只告警
      - name: Check formatting (Prettier, informational)
        continue-on-error: true
        working-directory: frontend
        run: npx prettier --check "src/**/*.{js,vue,css,json}" "*.{js,json}"

      # 依赖漏洞：npm ci 时故意用 --no-audit（省时间 + 避免注册表抖动把构建打红）。
      # 想真正挡住高危依赖，去掉 --no-audit 并把这条改成硬门槛（去掉下面这行）。
      - name: Audit dependencies (npm, informational)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high --json --omit=dev
